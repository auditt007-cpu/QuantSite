name: Auto Sync Quant Strategies

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install requests

      - name: Run Scraper
        run: python scripts/auto_collect_strategies.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "bot@quantalpha.space"
          git config --local user.name "QuantAlpha Strategy Bot"
          git add js/strategies_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update quant strategies from open-source pipeline [skip ci]" && git push)
