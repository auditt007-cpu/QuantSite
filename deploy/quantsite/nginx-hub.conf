# Proxy FastAPI hub in front of the static site / API host.
# include in the server { } that serves api.quantalpha.space (and local www).

# Plaza canonical: terminal.html was a twin of strategies.html
location = /terminal.html {
    return 301 /strategies.html$is_args$args;
}

# CORS preflight short-circuit for /api/
location /api/ {
    error_page 418 = @api_cors_preflight;
    if ($request_method = OPTIONS) {
        return 418;
    }

    proxy_pass http://127.0.0.1:8088/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header User-Agent $http_user_agent;

    add_header Access-Control-Allow-Origin $qa_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Webhook-Secret, X-Requested-With" always;
    add_header Vary Origin always;
}

location @api_cors_preflight {
    add_header Access-Control-Allow-Origin $qa_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Webhook-Secret, X-Requested-With" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Content-Length 0;
    add_header Content-Type text/plain;
    return 204;
}

location = /health {
    proxy_pass http://127.0.0.1:8088/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location /tg/webhook {
    proxy_pass http://127.0.0.1:8088/tg/webhook;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /static/charts/ {
    alias /var/www/html/static/charts/;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /strategies.json {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    default_type application/json;
}
