<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>量化执行终端 · 实盘状态监视器</title>
<style>
  /* ============================================================
     量化执行终端 · OBS Browser Source
     透明底 / 赛博朋克毛玻璃 / 等宽工程字体 / 机械化标签
     ============================================================ */
  :root {
    --bg:    rgba(10, 14, 23, 0.92);   /* 终端深色毛玻璃 */
    --neon:  #00ffa3;                  /* 荧光绿（盈利/达成） */
    --cyan:  #00e5ff;                  /* 青色（主色） */
    --amber: #ffb300;                  /* 琥珀（警示/强调） */
    --fire:  #ff6a00;                  /* 冲击态橙红 */
    --red:   #ff4d6d;                  /* 亏损红 */
    --ink:   #d8efe9;
    --muted: #6f8a94;
    --line:  rgba(0, 229, 255, 0.16);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  body {
    padding: 8px;
    font-family: "Roboto Mono", "Consolas", "Segoe UI", monospace;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 终端主容器：460px 宽，高度自适应 ---------- */
  .terminal {
    position: relative;
    width: 460px;
    border-radius: 10px;
    padding: 12px 14px 10px;
    background: var(--bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(0, 229, 255, 0.34);
    box-shadow: 0 0 24px rgba(0, 229, 255, 0.14),
                0 0 46px rgba(255, 179, 0, 0.05),
                inset 0 0 34px rgba(0, 229, 255, 0.04);
    color: var(--ink);
    overflow: hidden;
  }
  /* 周期性对角扫光 */
  .terminal::before {
    content: "";
    position: absolute; top: -50%; left: -90%;
    width: 46%; height: 200%;
    background: linear-gradient(105deg,
      transparent 20%, rgba(140, 255, 225, 0.05) 45%,
      rgba(200, 255, 245, 0.10) 50%,
      rgba(140, 255, 225, 0.05) 55%, transparent 80%);
    transform: skewX(-20deg);
    animation: sweep 3.6s ease-in-out infinite;
    pointer-events: none; z-index: 6;
  }
  @keyframes sweep { 0% { left: -90%; } 60%, 100% { left: 200%; } }
  /* 顶部霓虹饰线 */
  .terminal::after {
    content: "";
    position: absolute; top: 0; left: 12px; right: 12px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan) 30%, var(--amber) 70%, transparent);
    opacity: 0.8; pointer-events: none; z-index: 5;
  }

  /* ---------- 顶部：系统状态栏 ---------- */
  .sys-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--neon); flex: none;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1;   transform: scale(1);    box-shadow: 0 0 5px var(--neon); }
    50%      { opacity: 0.4; transform: scale(0.78); box-shadow: 0 0 13px var(--neon); }
  }
  /* ---------- 私域引导：Telegram 大号胶囊（小屏/远距离一眼可见） ---------- */
  .tg {
    margin-left: auto;
    font-size: 23px; font-weight: 800; letter-spacing: 0.5px;
    color: #ffffff;
    background: linear-gradient(135deg, #0a8fe0 0%, #0068c8 60%, #004fa8 100%);
    border: 1.5px solid rgba(110, 205, 255, 0.95);
    border-radius: 999px;
    padding: 9px 20px;
    text-shadow: 0 1px 3px rgba(0, 30, 80, 0.55), 0 0 14px rgba(120, 220, 255, 0.7);
    box-shadow: 0 0 16px rgba(0, 150, 255, 0.55), 0 0 44px rgba(0, 120, 255, 0.25),
                inset 0 0 14px rgba(255, 255, 255, 0.12);
    display: inline-flex; align-items: center; gap: 11px;
    text-decoration: none; cursor: pointer;
    animation: tgPulse 1.8s ease-in-out infinite;
  }
  .tg svg {
    flex: none; width: 26px; height: 26px;
    filter: drop-shadow(0 0 7px rgba(255, 255, 255, 0.65));
  }
  .tg:hover { filter: brightness(1.12); }
  @keyframes tgPulse {
    0%, 100% { box-shadow: 0 0 14px rgba(0, 150, 255, 0.5), 0 0 36px rgba(0, 120, 255, 0.2); }
    50%      { box-shadow: 0 0 22px rgba(0, 180, 255, 0.9), 0 0 56px rgba(0, 160, 255, 0.42); }
  }

  /* ---------- 24H 战报指标栏（三项横排） ---------- */
  /* ---------- 核心指标：今日胜率（单项居中放大） ---------- */
  .metrics {
    display: flex; justify-content: center; margin-bottom: 10px;
  }
  .metric {
    flex: 0 0 auto; min-width: 220px;
    background: rgba(0, 229, 255, 0.045);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 22px 9px;
    text-align: center;
  }
  .metric .k {
    display: block; font-size: 10.5px; letter-spacing: 2px;
    color: var(--muted); margin-bottom: 4px; white-space: nowrap;
  }
  .metric .v {
    display: block; font-size: 19px; font-weight: 800;
    color: var(--ink); white-space: nowrap;
  }
  .metric .v.win {
    color: #00ffb3; font-size: 22px;
    text-shadow: 0 0 12px rgba(0, 255, 163, 0.7), 0 0 26px rgba(0, 255, 163, 0.35);
    animation: metricGlow 2.4s ease-in-out infinite;
  }
  @keyframes metricGlow {
    0%, 100% { text-shadow: 0 0 6px rgba(0, 255, 163, 0.4); }
    50%      { text-shadow: 0 0 13px rgba(0, 255, 163, 0.8); }
  }

  /* ---------- 中部：活跃订单卡 ---------- */
  .order {
    background: rgba(0, 229, 255, 0.03);
    border: 1px solid var(--line);
    border-left: 2px solid var(--cyan);
    border-radius: 7px;
    padding: 8px 10px 7px;
    margin-bottom: 8px;
  }
  .order:last-of-type { margin-bottom: 9px; }

  .order-head { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
  .sym { font-size: 14px; font-weight: bold; letter-spacing: 0.5px; }
  .dir { font-size: 10px; font-weight: bold; padding: 1.5px 7px; border-radius: 4px; }
  .dir.long {
    color: var(--neon); border: 1px solid rgba(0, 255, 163, 0.5);
    background: rgba(0, 255, 163, 0.08); text-shadow: 0 0 6px rgba(0, 255, 163, 0.6);
  }
  .dir.short {
    color: var(--red); border: 1px solid rgba(255, 77, 109, 0.5);
    background: rgba(255, 77, 109, 0.08); text-shadow: 0 0 6px rgba(255, 77, 109, 0.6);
  }
  .ts { margin-left: auto; font-size: 9px; color: var(--muted); letter-spacing: 0.4px; }
  .entry-px { font-size: 10.5px; font-weight: bold; color: var(--cyan);
              text-shadow: 0 0 7px rgba(0, 229, 255, 0.35); }

  /* 进度轨道 + 4 节点 */
  .track {
    position: relative; height: 8px; margin: 14px 4px 16px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(0, 229, 255, 0.16);
  }
  .fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--neon), var(--cyan));
    box-shadow: 0 0 9px rgba(0, 255, 163, 0.5);
    overflow: hidden;
    transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .fill::after {   /* 流动光斑 */
    content: "";
    position: absolute; top: 0; left: -40%;
    width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
    animation: flow 1.8s linear infinite;
  }
  @keyframes flow { 0% { left: -40%; } 100% { left: 110%; } }

  .node {
    position: absolute; top: 50%;
    width: 17px; height: 17px; border-radius: 50%;
    transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center;
    font-size: 9.5px; font-weight: bold; z-index: 3;
  }
  .node.done {
    background: #0b3d2a; color: var(--neon);
    border: 1.5px solid var(--neon);
    box-shadow: 0 0 9px rgba(0, 255, 163, 0.6);
  }
  .node.active {
    background: #2a1505; border: 1.5px solid var(--fire);
    animation: fireGlow 0.9s ease-in-out infinite;
  }
  .node.active .flame {
    display: inline-block; font-size: 10px; line-height: 1;
    animation: bounce 0.7s ease-in-out infinite;
  }
  @keyframes fireGlow {
    0%, 100% { box-shadow: 0 0 5px rgba(255, 106, 0, 0.6); }
    50%      { box-shadow: 0 0 14px rgba(255, 106, 0, 1), 0 0 24px rgba(255, 60, 0, 0.5); }
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-2.5px) scale(1.12); }
  }
  .node.pending {
    background: rgba(20, 28, 38, 0.92);
    border: 1.5px solid rgba(255, 255, 255, 0.16);
  }
  .node.pending .dot { width: 4px; height: 4px; border-radius: 50%; background: #5a6a78; }

  /* 节点标签（上）与价格（下） */
  .node-label {
    position: absolute; bottom: 100%; left: 50%;
    transform: translateX(-50%); margin-bottom: 4px;
    font-size: 8.5px; white-space: nowrap; color: var(--muted); letter-spacing: 0.4px;
  }
  .node.done  .node-label { color: var(--neon); }
  .node.active .node-label { color: var(--fire); font-weight: bold; }
  .node-price {
    position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%); margin-top: 4px;
    font-size: 8.5px; white-space: nowrap; color: #9fb8c0;
  }

  /* 状态 + 盈亏 */
  .order-foot { display: flex; align-items: center; justify-content: space-between; }
  .state { font-size: 9.5px; color: var(--amber); letter-spacing: 0.4px; }
  .state b { color: var(--cyan); font-weight: bold; }
  .pnl {
    font-size: 22px; font-weight: 800; line-height: 1;
    color: var(--neon);
    animation: pnlGlow 2.4s ease-in-out infinite;
  }
  .pnl.neg { color: var(--red); animation-name: pnlGlowRed; }
  @keyframes pnlGlow {
    0%, 100% { text-shadow: 0 0 8px rgba(0, 255, 163, 0.45), 0 0 20px rgba(0, 255, 163, 0.16); }
    50%      { text-shadow: 0 0 14px rgba(0, 255, 163, 0.75), 0 0 34px rgba(0, 255, 163, 0.3); }
  }
  @keyframes pnlGlowRed {
    0%, 100% { text-shadow: 0 0 8px rgba(255, 77, 109, 0.45); }
    50%      { text-shadow: 0 0 14px rgba(255, 77, 109, 0.75); }
  }

  /* ---------- 底部：历史战绩跑马灯 ---------- */
  .ticker {
    display: flex; align-items: center;
    border-top: 1px solid var(--line);
    padding-top: 7px;
    height: 24px; overflow: hidden;
  }
  .ticker-tag {
    flex: none; font-size: 8.5px; font-weight: bold; letter-spacing: 1px;
    color: var(--amber); margin-right: 8px;
    text-shadow: 0 0 6px rgba(255, 179, 0, 0.4);
  }
  .ticker-mask { flex: 1; overflow: hidden; position: relative; }
  .ticker-track {
    display: inline-flex; white-space: nowrap;
    animation: ticker 22s linear infinite;
    will-change: transform;
  }
  @keyframes ticker {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .tick-item { font-size: 10px; color: #a8c4cc; margin-right: 26px; }
  .tick-item b { color: var(--neon); font-weight: bold; }
  .tick-item .tm { color: var(--muted); }
</style>
</head>
<body>

<div class="terminal" id="terminal">
  <!-- 顶部：系统状态栏 -->
  <div class="sys-bar">
    <span class="live-dot"></span>
    <a class="tg" id="tgGroup" href="https://t.me/weex8888" target="_blank" rel="noopener"></a>
  </div>

  <!-- 24H 战报指标栏（JS 渲染） -->
  <div class="metrics" id="metrics"></div>

  <!-- 活跃订单区（JS 渲染） -->
  <div id="orders"></div>

  <!-- 底部：历史战绩跑马灯 -->
  <div class="ticker">
    <span class="ticker-tag">执行日志 ▸</span>
    <div class="ticker-mask"><div class="ticker-track" id="tickerTrack"></div></div>
  </div>
</div>

<script>
"use strict";

/* =========================================================================
 * 唯一数据源：量化执行终端渲染数据
 * 接入外部 API 时调用 window.updateQuantData(patch) 增量更新并重渲染
 * ========================================================================= */
window.QUANT_DATA = {
  system: {
    tgGroup:    "t.me/weex8888",
    winRate24h: "94.2%",
    stats24h:   "17战 16胜 1损",
    tpStats:    "16 | 11 | 6"
  },
  activeOrders: [
    {
      symbol:     "BTC/USDT",
      direction:  "LONG 做多",
      leverage:   "20x",
      entryTime:  "08-30 13:48",
      entryPrice: "78,200.0",
      progress:   68,
      statusText: "正在冲击 TP3",
      pnl:        "+114.6%",
      tpNodes: [
        { label: "入场", price: "78200", status: "done" },
        { label: "TP1",  price: "79100", status: "done" },
        { label: "TP2",  price: "79900", status: "done" },
        { label: "TP3",  price: "80900", status: "active" }
      ]
    },
    {
      symbol:     "ETH/USDT",
      direction:  "LONG 做多",
      leverage:   "20x",
      entryTime:  "08-30 14:10",
      entryPrice: "2,540.0",
      progress:   42,
      statusText: "正在冲击 TP2",
      pnl:        "+56.8%",
      tpNodes: [
        { label: "入场", price: "2540", status: "done" },
        { label: "TP1",  price: "2575", status: "done" },
        { label: "TP2",  price: "2610", status: "active" },
        { label: "TP3",  price: "2660", status: "pending" }
      ]
    }
  ],
  historyReports: [
    { time: "13:20", text: 'SOL/USDT 做多 → TP3 已打靶 <b>(+182%)</b> ✓' },
    { time: "11:05", text: 'BTC/USDT 做空 → TP2 已打靶 <b>(+86.4%)</b> ✓' },
    { time: "09:40", text: 'ETH/USDT 做多 → TP1 已达标 <b>(+42.1%)</b> ✓' }
  ]
};

/* 节点轨道位置（%）：入场 / TP1 / TP2 / TP3 */
const NODE_POS = [2, 34, 66, 98];

function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
}

/* ---------- 顶部战报指标栏 ---------- */
function renderMetrics(d) {
  const box = document.getElementById("metrics");
  box.innerHTML = "";
  const items = [
    { k: "今日胜率", v: d.winRate24h, win: true }
  ];
  for (const it of items) {
    const m = el("div", "metric");
    m.appendChild(el("span", "k", it.k));
    m.appendChild(el("b", "v" + (it.win ? " win" : ""), it.v));
    box.appendChild(m);
  }
}

/* ---------- 订单卡（含进度条 + 4 节点） ---------- */
function renderOrders(orders) {
  const box = document.getElementById("orders");
  box.innerHTML = "";
  if (!orders.length) {
    box.appendChild(el("div", "order",
      '<span class="state" style="color: var(--muted)">当前无持仓 · 等待下一个 TP 信号</span>'));
    return;
  }

  orders.forEach((o, oi) => {
    const card = el("div", "order");

    /* 标的信息栏 */
    const head = el("div", "order-head");
    head.appendChild(el("span", "sym", o.symbol));
    const isLong = /LONG|多/.test(o.direction);
    head.appendChild(el("span", "dir " + (isLong ? "long" : "short"),
      (isLong ? "▲ 做多" : "▼ 做空") + " [" + String(o.leverage).toUpperCase() + "]"));
    head.appendChild(el("span", "ts", o.entryTime + " 北京时间"));
    head.appendChild(el("span", "entry-px", "@" + o.entryPrice));
    card.appendChild(head);

    /* 进度轨道 + 节点 */
    const track = el("div", "track");
    const fill = el("div", "fill");
    fill.style.width = Math.max(0, Math.min(100, o.progress)) + "%";
    track.appendChild(fill);

    o.tpNodes.forEach((nd, i) => {
      const node = el("div", "node " + nd.status);
      node.style.left = NODE_POS[i] + "%";
      if (nd.status === "done")         node.innerHTML = "✓";
      else if (nd.status === "active")  node.innerHTML = '<span class="flame">🔥</span>';
      else                              node.innerHTML = '<span class="dot"></span>';
      node.appendChild(el("span", "node-label", nd.label));
      if (i > 0) node.appendChild(el("span", "node-price", nd.price));
      track.appendChild(node);
    });
    card.appendChild(track);

    /* 状态 + 盈亏 */
    const foot = el("div", "order-foot");
    foot.appendChild(el("span", "state",
      '<b>[跟踪中]</b> 执行ID: #' + (8942 + oi) + ' · ' + o.statusText));
    const pnl = el("span", "pnl", o.pnl);
    if (/^-/.test(o.pnl)) pnl.classList.add("neg");
    foot.appendChild(pnl);
    card.appendChild(foot);

    box.appendChild(card);
  });
}

/* ---------- 底部历史战绩跑马灯（双份内容实现无缝循环） ---------- */
function renderTicker(reports) {
  const track = document.getElementById("tickerTrack");
  track.innerHTML = "";
  const one = document.createDocumentFragment();
  reports.forEach((r) => {
    const item = typeof r === "string" ? { time: "", text: r } : r;
    one.appendChild(el("span", "tick-item",
      (item.time ? '<span class="tm">[' + item.time + ' 结单]</span> ' : "") + item.text));
  });
  track.appendChild(one.cloneNode(true));   /* 第 1 份 */
  track.appendChild(one.cloneNode(true));   /* 第 2 份（无缝衔接） */
}

/* Telegram 官方 APP logo（蓝色圆底纸飞机） */
const TG_LOGO =
  '<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">' +
  '<circle cx="12" cy="12" r="12" fill="#ffffff"/>' +
  '<path d="M5.5 11.8l12-4.6c.6-.2 1.1.2.9.9l-2.3 10.6c-.2.8-.7 1-1.2.6l-3.3-2.4-1.6 1.5c-.2.2-.4.4-.7.4l.3-3.4 6.1-5.5c.3-.2-.1-.4-.4-.2L7.7 13.6l-3.1-1c-.7-.2-.7-.7.1-.8z" fill="#0088cc"/>' +
  '</svg>';

/* ---------- 总渲染入口 ---------- */
function render() {
  const d = window.QUANT_DATA;
  document.getElementById("tgGroup").innerHTML = TG_LOGO + "<span>" + d.system.tgGroup + "</span>";
  renderMetrics(d.system);
  renderOrders(d.activeOrders);
  renderTicker(d.historyReports);
}

/* 外部更新接口：增量合并后重渲染（可对接 API 轮询 / WebSocket） */
window.updateQuantData = function (patch) {
  const d = window.QUANT_DATA;
  if (patch.system)          Object.assign(d.system, patch.system);
  if (patch.activeOrders)    d.activeOrders = patch.activeOrders;
  if (patch.historyReports)  d.historyReports = patch.historyReports;
  render();
};

/* =========================================================================
 * 实时数据自动刷新：每 60s 拉取 VPS 生成的 feed JSON（量化执行终端同源数据）
 * 数据源：cron 每 5 分钟在 VPS 生成 → api.quantalpha.space/data/signal_feed.json
 * ========================================================================= */
const FEED_URL = "https://api.quantalpha.space/data/signal_feed.json";

async function refreshFeed() {
  try {
    const resp = await fetch(FEED_URL, { cache: "no-store" });
    if (!resp.ok) return;
    const feed = await resp.json();
    if (feed && feed.system) {
      window.updateQuantData({
        system: feed.system,
        activeOrders: feed.activeOrders || [],
        historyReports: feed.historyReports || []
      });
    }
  } catch (_) {
    /* 网络/解析失败：静默保留当前数据，等待下一轮 */
  }
}

/* =========================================================================
 * 实时价格层：持仓卡的 progress / pnl / TP 档位状态 用 OKX 实时价每 2s 刷新
 * 数据源：VPS nginx 反代 api.quantalpha.space/price/（OKX 公开行情，CORS 已放行）
 * 结构数据（开/平仓、战绩）仍由 refreshFeed 低频驱动；价格高频覆盖数字。
 * 公式与后端 quant/signal_feed.py 完全一致（ROE×杠杆 / 相对 TP3 完成度）。
 * ========================================================================= */
const PRICE_BASE = "https://api.quantalpha.space/price/tickers?instType=SPOT";
const SYM_TO_INST = { "BTC/USDT": "BTC-USDT", "ETH/USDT": "ETH-USDT" };

async function fetchLivePrices() {
  const orders = window.QUANT_DATA.activeOrders || [];
  if (!orders.length || document.hidden) return;   /* 无持仓/页面隐藏不轮询 */
  const insts = orders
    .map(o => SYM_TO_INST[o.symbol] || String(o.symbol).replace("/", "-"))
    .filter(Boolean);
  if (!insts.length) return;
  try {
    const resp = await fetch(PRICE_BASE, { cache: "no-store" });
    if (!resp.ok) return;
    const j = await resp.json();
    if (!j || (j.code !== "0" && j.code !== 0) || !Array.isArray(j.data)) return;
    const prices = {};
    j.data.forEach(t => { if (insts.includes(t.instId)) prices[t.instId] = parseFloat(t.last); });
    applyLivePrices(prices);
  } catch (_) { /* 网络异常：静默保留当前数字 */ }
}

function applyLivePrices(prices) {
  const orders = window.QUANT_DATA.activeOrders || [];
  let changed = false;
  orders.forEach(o => {
    const inst = SYM_TO_INST[o.symbol] || String(o.symbol).replace("/", "-");
    const px = prices[inst];
    if (!px) return;
    const isLong = /LONG|多/.test(o.direction);
    const lev = parseFloat(String(o.leverage).replace(/[^\d.]/g, "")) || 1;
    const entry = parseFloat(String(o.entryPrice).replace(/[^\d.]/g, ""));
    const tps = (o.tpNodes || []).map(n => parseFloat(String(n.price).replace(/[^\d.]/g, "")));
    if (!entry || tps.length < 4) return;          /* tpNodes=[入场,TP1,TP2,TP3] */

    /* 触达档位：多空各自判定 */
    let maxTp = 0;
    for (let i = 1; i <= 3; i++) {
      if (!tps[i]) continue;
      if (isLong ? px >= tps[i] : px <= tps[i]) maxTp = i;
    }

    /* pnl：ROE × 杠杆（与后端同一公式） */
    const roe = (px - entry) / entry * 100 * lev * (isLong ? 1 : -1);

    /* progress：相对 TP3 完成度（SHORT 反向），clamp 0-100 */
    let prog = o.progress;
    if (tps[3]) {
      prog = (px - entry) / (tps[3] - entry) * 100 * (isLong ? 1 : -1);
      prog = Math.max(0, Math.min(100, prog));
    }
    if (maxTp >= 3) prog = 100;

    const statusText = maxTp >= 3 ? "TP3 已全部打靶" : "正在冲击 TP" + Math.min(maxTp + 1, 3);

    o.tpNodes.forEach((nd, i) => {
      if (i === 0) nd.status = "done";
      else if (i <= maxTp) nd.status = "done";
      else if (i === maxTp + 1) nd.status = "active";
      else nd.status = "pending";
    });

    o.progress = prog;
    o.pnl = (roe >= 0 ? "+" : "") + roe.toFixed(1) + "%";
    o.statusText = statusText;
    changed = true;
  });
  if (changed) renderOrders(orders);               /* 只重渲订单区，指标/跑马灯不动 */
}

document.addEventListener("DOMContentLoaded", () => {
  render();
  refreshFeed();
  setInterval(refreshFeed, 60000);
  setInterval(fetchLivePrices, 2000);
});
</script>
</body>
