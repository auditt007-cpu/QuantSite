<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- iOS Safari 专属高清大图标（防白色方块） -->
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=202608250450-qmark">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=202608250450-qmark">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png?v=202608250450-qmark">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png?v=202608250450-qmark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#09090b">
  <meta name="robots" content="noindex,nofollow" />
  <title>QUANT ALPHA · Admin</title>
  <link rel="stylesheet" href="./styles.css?v=202608250841-bc30f35" />
  <link rel="stylesheet" href="./css/mobile-global.css?v=202608250841-bc30f35" />
  <link rel="stylesheet" href="./css/mobile-subpages.css?v=202608250841-bc30f35" />
  <link rel="stylesheet" href="./css/bloomberg-system.css?v=202608250841-bc30f35" />
  <link rel="stylesheet" href="./css/bloomberg-dark.css?v=202608250841-bc30f35" />
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="./index.html">
        <div class="logo"></div>
        <div class="brand-text">
          <h1>QUANT.ALPHA</h1>
          <p class="site-slogan">Admin</p>
        </div>
      </a>
    </header>

    <section class="desk" id="gate">
      <div class="kicker">ADMIN</div>
      <h2 class="h2">後台登入</h2>
      <p class="muted">需輸入 Worker 環境變數 <code>WEBHOOK_SECRET</code>。未設定密鑰則無法進入。此頁不在前台導航中公開。</p>
      <input id="secret" type="password" autocomplete="current-password" placeholder="Admin 密碼（WEBHOOK_SECRET）" />
      <button class="btn cyan" id="btnLogin">登入</button>
      <p class="status" id="st"></p>
    </section>

    <section class="desk" id="console" hidden>
      <div class="kicker">ADMIN</div>
      <h2 class="h2">策略廣場後台</h2>
      <p class="muted">會員資料來自 KV；登入次數在 TG 綁定時累加，最近活躍在網站心跳時更新。</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn cyan" id="btnReload">重新載入</button>
        <button class="btn ghost" id="btnLogout">登出</button>
      </div>
      <p class="status" id="st2"></p>

      <h3 class="zone-title">會員管理</h3>
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th>Telegram</th>
              <th>付費</th>
              <th>席位</th>
              <th>登入次數</th>
              <th>最近登入</th>
              <th>最近活躍</th>
              <th>IP</th>
              <th>地區</th>
              <th>邀請</th>
              <th>註冊時間</th>
            </tr>
          </thead>
          <tbody id="members"></tbody>
        </table>
      </div>

      <h3 class="zone-title">策略 KV</h3>
      <table class="data-table" style="margin-top:16px">
        <thead>
          <tr><th>ID</th><th>名稱</th><th>分區</th><th>幣種</th><th>週期</th><th>標籤</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <h4 style="margin-top:18px;color:var(--text-main)">新增 / 更新</h4>
      <input id="id" placeholder="id（如 dual）" />
      <input id="name" placeholder="名稱" />
      <input id="symbols" placeholder="幣種，逗號分隔，如 BTCUSDT" />
      <input id="interval" placeholder="週期 1m/5m/15m/1h/4h/1d/1w" />
      <input id="tags" placeholder="標籤，逗號分隔" />
      <input id="engine" placeholder="引擎 id" />
      <select id="tier">
        <option value="free">免費區</option>
        <option value="master">大師組</option>
      </select>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn-cta compact" id="btnUpsert">寫入 KV</button>
        <button class="btn amber" id="btnDel">刪除 ID</button>
      </div>
    </section>
  </div>
  <div class="toast" id="toast"></div>
  <script src="./js/binance-feed.js?v=202608250841-bc30f35"></script>
  <script src="./js/nav.js?v=202608250841-bc30f35"></script>
  <script src="./config.js?v=202608250841-bc30f35"></script>
  <script src="./js/meta-events.js?v=202608250841-bc30f35"></script>
  <script src="./js/admin.js?v=202608250841-bc30f35"></script>
  <script src="./js/compliance.js?v=202608250841-bc30f35"></script>
</body>
</html>
